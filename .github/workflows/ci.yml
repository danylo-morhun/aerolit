name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole gate, in the order that fails fastest: formatting and types before
# the test suites, and the browser suite last because it is the slow one.
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Chromium for the desktop, iPad and phone projects; WebKit because an
      # iPad is a Safari, and the engine differences are the point of that
      # project. The visual-baseline spec skips itself here: its images were
      # captured on macOS, and matching them would mean capturing a set inside
      # this container.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
