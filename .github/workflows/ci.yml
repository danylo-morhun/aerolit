name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole gate, in the order that fails fastest: formatting and types before
# the test suites, and the browser suite last because it is the slow one.
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Only Chromium: the e2e projects both run on it (see playwright.config.ts),
      # so pulling the other engines would be download time for nothing.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
